<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TENSE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #f0f0f0;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 40px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 35px;
    }
    header h1 {
      font-size: 2.4rem;
      letter-spacing: 4px;
      color: #4ade80;
    }
    #status {
      color: #a1a1aa;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2e2e2e;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      cursor: pointer;
      display: block;
    }
    .card-info {
      padding: 12px 14px;
      font-size: 0.85rem;
      color: #9ca3af;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 88vh;
      border-radius: 8px;
    }
    .nav-btn, .close-btn {
      position: fixed;
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      user-select: none;
    }
    .nav-btn:hover, .close-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }
    .nav-btn {
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.8rem;
      padding: 12px 16px;
    }
    .prev { left: 20px; }
    .next { right: 20px; }
    .close-btn {
      top: 20px;
      right: 20px;
      font-size: 1.8rem;
      padding: 4px 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>TENSE</h1>
    <p id="status"></p>
  </header>

  <main class="gallery" id="gallery"></main>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <button class="close-btn" onclick="document.getElementById('lightbox').classList.remove('active')">&times;</button>
    <button class="nav-btn prev" onclick="degistir(-1, event)">&#10094;</button>
    <img id="lightbox-img" src="" alt="Görsel">
    <button class="nav-btn next" onclick="degistir(1, event)">&#10095;</button>
  </div>

  <script>
    const kullaniciAdi = "KULLANICI_ADIN";
    const repoAdi = "REPO_ADIN";
    const klasorAdi = "ss";

    let gorseller = [];
    let aktifIndex = 0;

    async function galeriyiYukle() {
      const galeri = document.getElementById("gallery");
      const durum = document.getElementById("status");
      const apiUrl = `https://api.github.com/repos/${kullaniciAdi}/${repoAdi}/contents/${klasorAdi}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Klasör bulunamadı veya bilgiler hatalı.");
        const dosyalar = await response.json();

        gorseller = dosyalar
          .filter(d => d.type === "file" && /\.(png|jpe?g|webp|gif)$/i.test(d.name))
          .map(d => ({
            ad: d.name.replace(/\.[^/.]+$/, ""),
            yol: `${klasorAdi}/${encodeURIComponent(d.name)}`
          }));

        if (gorseller.length === 0) {
          durum.textContent = "Klasörde henüz görsel yok.";
          return;
        }

        durum.style.display = "none";

        gorseller.forEach((gorsel, index) => {
          const card = document.createElement("div");
          card.className = "card";

          const img = document.createElement("img");
          img.src = gorsel.yol;
          img.alt = gorsel.ad;
          img.loading = "lazy";
          img.onclick = () => openLightbox(index);

          const info = document.createElement("div");
          info.className = "card-info";
          info.textContent = gorsel.ad;

          card.appendChild(img);
          card.appendChild(info);
          galeri.appendChild(card);
        });
      } catch (err) {
        durum.textContent = "Görseller yüklenemedi: " + err.message;
      }
    }

    function openLightbox(index) {
      aktifIndex = index;
      document.getElementById("lightbox-img").src = gorseller[aktifIndex].yol;
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox(e) {
      if (e && e.target.id !== "lightbox") return;
      document.getElementById("lightbox").classList.remove("active");
    }

    function degistir(yon, e) {
      e.stopPropagation();
      aktifIndex = (aktifIndex + yon + gorseller.length) % gorseller.length;
      document.getElementById("lightbox-img").src = gorseller[aktifIndex].yol;
    }

    document.addEventListener("keydown", e => {
      const lb = document.getElementById("lightbox");
      if (!lb.classList.contains("active")) return;
      if (e.key === "Escape") lb.classList.remove("active");
      if (e.key === "ArrowRight") degistir(1, e);
      if (e.key === "ArrowLeft") degistir(-1, e);
    });

    galeriyiYukle();
  </script>
</body>
</html>
