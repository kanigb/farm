<script>
    const kullaniciAdi = "KULLANICI_ADIN";
    const repoAdi = "REPO_ADIN";

    let gorseller = [];
    let aktifIndex = 0;

    async function galeriyiYukle() {
      const galeri = document.getElementById("gallery");
      const durum = document.getElementById("status");
      const apiUrl = `https://api.github.com/repos/${kullaniciAdi}/${repoAdi}/contents`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("Repo bulunamadı veya bilgiler hatalı.");
        const dosyalar = await response.json();

        gorseller = dosyalar
          .filter(d => d.type === "file" && /\.(png|jpe?g|webp|gif)$/i.test(d.name))
          .map(d => ({
            ad: d.name.replace(/\.[^/.]+$/, ""),
            yol: encodeURIComponent(d.name)
          }));

        if (gorseller.length === 0) {
          durum.textContent = "Henüz görsel yok.";
          return;
        }

        durum.style.display = "none";

        gorseller.forEach((gorsel, index) => {
          const card = document.createElement("div");
          card.className = "card";

          const img = document.createElement("img");
          img.src = gorsel.yol;
          img.alt = gorsel.ad;
          img.loading = "lazy";
          img.onclick = () => openLightbox(index);

          const info = document.createElement("div");
          info.className = "card-info";
          info.textContent = gorsel.ad;

          card.appendChild(img);
          card.appendChild(info);
          galeri.appendChild(card);
        });
      } catch (err) {
        durum.textContent = "Görseller yüklenemedi: " + err.message;
      }
    }

    function openLightbox(index) {
      aktifIndex = index;
      document.getElementById("lightbox-img").src = gorseller[aktifIndex].yol;
      document.getElementById("lightbox").classList.add("active");
    }

    function closeLightbox(e) {
      if (e && e.target.id !== "lightbox") return;
      document.getElementById("lightbox").classList.remove("active");
    }

    function degistir(yon, e) {
      e.stopPropagation();
      aktifIndex = (aktifIndex + yon + gorseller.length) % gorseller.length;
      document.getElementById("lightbox-img").src = gorseller[aktifIndex].yol;
    }

    document.addEventListener("keydown", e => {
      const lb = document.getElementById("lightbox");
      if (!lb.classList.contains("active")) return;
      if (e.key === "Escape") lb.classList.remove("active");
      if (e.key === "ArrowRight") degistir(1, e);
      if (e.key === "ArrowLeft") degistir(-1, e);
    });

    galeriyiYukle();
  </script>
